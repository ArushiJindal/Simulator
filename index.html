<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    </head>

    <body>
    <div class="container">
        <header class="main-header">
            <h1>YouTube Analysis</h1>
            <nav><a href="insights.html">AI Insights Across Summaries</a></nav>
        </header>
        <main>
            <div id="health-banner" class="health-banner" style="display: none;"></div>

            <div class="card">
                <h2>Ad-hoc Video Analysis</h2>
                <p style="margin-top: -0.5rem; color: #a89bc4; font-size: 0.9rem;">Paste any YouTube URL and ask your own question — not limited to the tracked channels below.</p>
                <form id="adhoc-form" class="adhoc-form">
                    <input type="text" id="adhoc-url" placeholder="YouTube URL (e.g. https://www.youtube.com/watch?v=...)" required>
                    <textarea id="adhoc-prompt" placeholder="What do you want to know? (e.g. Summarize the key stock picks and price targets mentioned.)" required></textarea>
                    <button type="submit" id="adhoc-submit">Analyze Video</button>
                </form>
                <div id="adhoc-result" class="adhoc-result" style="display: none;"></div>

                <div id="recent-adhoc" class="recent-list" style="display: none;">
                    <h3>Recent Ad-hoc Analyses</h3>
                    <div id="recent-adhoc-items"></div>
                </div>
            </div>

            <div class="card" style="margin-top: 1.5rem;">
                <h2>Select a Channel</h2>
                <div id="channel-selector" class="channel-selector"></div>
            </div>
            <div id="video-results" class="card" style="display: none; margin-top: 1.5rem;"></div>
        </main>
    </div>
    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>

</html>
